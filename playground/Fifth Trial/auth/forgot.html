<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — clone template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="topbar"><div class="wrap topbar-inner">
    <a href="#" class="active">For Individuals</a><a href="#">For Businesses</a><a href="#">For Universities</a><a href="#">For Governments</a>
  </div></div>

  <header class="header"><div class="wrap header-inner">
    <a href="../public/index.html" class="logo">azurebek</a>
    <a href="#" class="nav-item">Explore <i class="bi bi-chevron-down" style="font-size:12px"></i></a>
    <a href="#" class="nav-item">Degrees</a>
    <div class="search"><input type="text" placeholder="What do you want to learn?"><button aria-label="Search"><i class="bi bi-search"></i></button></div>
    <div class="header-right"><a href="login.html" class="login">Log In</a><a href="signup.html" class="btn btn-outline btn-sm">Join for Free</a></div>
  </div></header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot password</h1>
      <p class="auth-sub">Enter the email address you use on azurebek. We'll send you a link to reset your password.</p>

      <div class="field">
        <label>Email <span class="req">*</span></label>
        <input class="inp" type="email" placeholder="name@email.com">
      </div>

      <a class="btn btn-primary btn-block" href="#">Reset Password</a>

      <div class="divider">or</div>

      <a class="btn btn-outline btn-block" href="#" style="margin-top:0">Email me a login link</a>

      <p class="auth-alt">Back to <a href="login.html">Log in</a></p>
    </div>
  </main>

</body>
</html>
