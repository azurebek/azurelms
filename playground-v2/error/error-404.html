<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sahifa topilmadi · AzureLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eff2f6; --white: #ffffff; --border: #dde4ee;
      --ink-0: #0d1b2a; --ink-1: #1e3248; --ink-3: #4d6680; --ink-4: #7a90a8; --ink-5: #a8bcce;
      --blue: #1d57d8; --blue-mid: #2563eb; --blue-soft: rgba(29,87,216,.09);
      --deep: #0d1b2a; --on-deep: #eff2f6;
      --sh-sm: 0 1px 3px rgba(13,27,42,.05), 0 4px 12px rgba(13,27,42,.07);
      --sh-md: 0 4px 12px rgba(13,27,42,.08), 0 16px 48px rgba(13,27,42,.10);
      --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-pill: 999px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --bg: #0c1520; --white: #152233; --border: #1e3450;
      --ink-0: #dce9f5; --ink-1: #b8d0e6; --ink-3: #6288a4; --ink-4: #3f607e; --ink-5: #284259;
      --blue: #60a5fa; --blue-mid: #3b82f6; --blue-soft: rgba(96,165,250,.12);
      --deep: #070e18; --on-deep: #dce9f5;
      --sh-sm: 0 1px 3px rgba(0,0,0,.20), 0 4px 12px rgba(0,0,0,.24);
      --sh-md: 0 4px 12px rgba(0,0,0,.28), 0 16px 48px rgba(0,0,0,.30);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg);
      color: var(--ink-0); -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      transition: background 280ms, color 280ms;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    .theme-btn { position: fixed; top: 20px; right: 20px; width: 38px; height: 38px; border-radius: var(--r-md); background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--ink-4); transition: all 120ms; z-index: 10; }
    .theme-btn:hover { color: var(--ink-0); }

    .error-wrap { text-align: center; max-width: 520px; animation: fadeUp 500ms var(--ease) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    /* SVG Illustration */
    .illustration { width: 280px; height: 220px; margin: 0 auto 36px; }

    .error-code {
      font-size: 7rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--blue-mid), #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 24px rgba(37,99,235,.25));
    }
    .error-title { font-size: 1.5rem; font-weight: 800; color: var(--ink-0); margin-bottom: 10px; }
    .error-desc { font-size: 0.92rem; color: var(--ink-3); line-height: 1.65; margin-bottom: 32px; }

    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 22px; border-radius: var(--r-pill); font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; transition: all 140ms var(--ease); }
    .btn-primary { background: var(--blue-mid); color: #fff; }
    .btn-primary:hover { background: var(--blue); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,.35); }
    .btn-ghost { background: var(--white); color: var(--ink-1); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); transform: translateY(-1px); }

    .suggestions { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 22px 24px; text-align: left; box-shadow: var(--sh-sm); }
    .suggestions-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-5); margin-bottom: 12px; }
    .sugg-list { display: flex; flex-direction: column; gap: 4px; }
    .sugg-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-md); font-size: 0.84rem; font-weight: 500; color: var(--ink-1); transition: background 120ms; }
    .sugg-link:hover { background: var(--bg); }
    .sugg-link i { font-size: 0.95rem; color: var(--ink-4); width: 16px; }

    .nav-logo { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; }
    .logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--blue-mid); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; }
    .logo-name { font-size: 0.88rem; font-weight: 800; color: var(--ink-0); }
  </style>
</head>
<body>
  <script>(function(){ try { var t=localStorage.getItem('lms-theme'); if(t) document.documentElement.setAttribute('data-theme',t); } catch(e){} })();</script>

  <a href="../index.html" class="nav-logo">
    <div class="logo-mark">AL</div>
    <span class="logo-name">AzureLMS</span>
  </a>
  <button class="theme-btn" onclick="toggleTheme()"><i class="bi bi-moon-stars" id="themeIcon"></i></button>

  <div class="error-wrap">
    <!-- SVG Illustration -->
    <svg class="illustration" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground -->
      <ellipse cx="140" cy="200" rx="100" ry="12" fill="var(--border-soft, #e8eef6)" opacity=".6"/>
      <!-- Broken page body -->
      <rect x="70" y="40" width="140" height="160" rx="12" fill="var(--white, #fff)" stroke="var(--border, #dde4ee)" stroke-width="1.5"/>
      <!-- Page lines -->
      <rect x="88" y="68" width="80" height="8" rx="4" fill="var(--border, #dde4ee)"/>
      <rect x="88" y="84" width="104" height="6" rx="3" fill="var(--border-soft, #e8eef6)"/>
      <rect x="88" y="96" width="90" height="6" rx="3" fill="var(--border-soft, #e8eef6)"/>
      <!-- Crack lines -->
      <path d="M140 40 L132 100 L148 100 L140 160" stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M132 100 L112 120" stroke="#f87171" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/>
      <path d="M148 100 L168 115" stroke="#f87171" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/>
      <!-- 404 text in page -->
      <text x="140" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="28" font-weight="800" fill="var(--blue-mid, #2563eb)" opacity=".15">404</text>
      <!-- Magnifier -->
      <circle cx="196" cy="60" r="22" fill="none" stroke="var(--blue-mid, #2563eb)" stroke-width="3" opacity=".7"/>
      <circle cx="196" cy="60" r="14" fill="var(--blue-soft, rgba(37,99,235,.09))"/>
      <line x1="212" y1="76" x2="226" y2="90" stroke="var(--blue-mid, #2563eb)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <!-- Question mark inside magnifier -->
      <text x="196" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="14" font-weight="800" fill="var(--blue-mid, #2563eb)">?</text>
      <!-- Stars -->
      <circle cx="60" cy="30" r="3" fill="var(--blue-mid, #2563eb)" opacity=".4"/>
      <circle cx="220" cy="45" r="2" fill="#7c3aed" opacity=".4"/>
      <circle cx="50" cy="120" r="2" fill="var(--blue-mid, #2563eb)" opacity=".3"/>
      <circle cx="240" cy="130" r="3" fill="#7c3aed" opacity=".3"/>
    </svg>

    <div class="error-code">404</div>
    <div class="error-title">Sahifa topilmadi</div>
    <div class="error-desc">Siz qidirayotgan sahifa o'chirilgan, ko'chirilgan yoki hech qachon mavjud bo'lmagan. URL manzilini tekshiring yoki quyidagi havolalardan birini tanlang.</div>

    <div class="btn-row">
      <a href="../index.html" class="btn btn-primary"><i class="bi bi-house-fill"></i> Bosh sahifaga</a>
      <button class="btn btn-ghost" onclick="history.back()"><i class="bi bi-arrow-left"></i> Orqaga qaytish</button>
    </div>

    <div class="suggestions">
      <div class="suggestions-title">Foydali havolalar</div>
      <div class="sugg-list">
        <a href="../app/app-shell.html" class="sugg-link"><i class="bi bi-grid-1x2"></i> Boshqaruv paneli</a>
        <a href="../public/course-list.html" class="sugg-link"><i class="bi bi-mortarboard"></i> Kurslar ro'yxati</a>
        <a href="../exam/exam-shell.html" class="sugg-link"><i class="bi bi-patch-check"></i> Imtihon markazi</a>
        <a href="../blog/blog-shell.html" class="sugg-link"><i class="bi bi-newspaper"></i> Blog maqolalari</a>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').className = isDark ? 'bi bi-moon-stars' : 'bi bi-sun';
      try { localStorage.setItem('lms-theme', isDark ? 'light' : 'dark'); } catch(e){}
    }
    (function(){ try { if(localStorage.getItem('lms-theme')==='dark') document.getElementById('themeIcon').className='bi bi-sun'; } catch(e){} })();
  </script>
</body>
</html>
