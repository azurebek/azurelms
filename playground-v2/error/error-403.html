<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 — Ruxsat yo'q · AzureLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eff2f6; --white: #ffffff; --border: #dde4ee; --border-soft: #e8eef6;
      --ink-0: #0d1b2a; --ink-1: #1e3248; --ink-3: #4d6680; --ink-4: #7a90a8; --ink-5: #a8bcce;
      --blue-mid: #2563eb; --blue: #1d57d8; --blue-soft: rgba(29,87,216,.09);
      --purple: #6d28d9; --purple-soft: rgba(109,40,217,.09);
      --amber: #b45309; --amber-soft: rgba(180,83,9,.10);
      --deep: #0d1b2a; --on-deep: #eff2f6;
      --sh-sm: 0 1px 3px rgba(13,27,42,.05),0 4px 12px rgba(13,27,42,.07);
      --r-md: 10px; --r-xl: 20px; --r-pill: 999px; --ease: cubic-bezier(0.16,1,0.3,1);
    }
    [data-theme="dark"] {
      --bg: #0c1520; --white: #152233; --border: #1e3450; --border-soft: #172a40;
      --ink-0: #dce9f5; --ink-1: #b8d0e6; --ink-3: #6288a4; --ink-4: #3f607e; --ink-5: #284259;
      --blue-mid: #3b82f6; --blue: #60a5fa; --blue-soft: rgba(96,165,250,.12);
      --purple: #a78bfa; --purple-soft: rgba(167,139,250,.12);
      --amber: #fbbf24; --amber-soft: rgba(251,191,36,.12);
      --deep: #070e18; --on-deep: #dce9f5;
      --sh-sm: 0 1px 3px rgba(0,0,0,.20),0 4px 12px rgba(0,0,0,.24);
    }
    body { font-family: 'Plus Jakarta Sans',sans-serif; background: var(--bg); color: var(--ink-0); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; transition: background 280ms,color 280ms; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    .theme-btn { position: fixed; top: 20px; right: 20px; width: 38px; height: 38px; border-radius: var(--r-md); background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--ink-4); z-index: 10; }
    .nav-logo { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; }
    .logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--purple); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; }
    .logo-name { font-size: 0.88rem; font-weight: 800; color: var(--ink-0); }
    .error-wrap { text-align: center; max-width: 520px; animation: fadeUp 500ms var(--ease) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .illustration { width: 260px; height: 220px; margin: 0 auto 36px; }
    .error-code { font-size: 7rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg,var(--purple),var(--amber)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom: 12px; }
    .error-title { font-size: 1.5rem; font-weight: 800; color: var(--ink-0); margin-bottom: 10px; }
    .error-desc { font-size: 0.92rem; color: var(--ink-3); line-height: 1.65; margin-bottom: 28px; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 22px; border-radius: var(--r-pill); font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; transition: all 140ms var(--ease); }
    .btn-primary { background: var(--blue-mid); color: #fff; }
    .btn-primary:hover { background: var(--blue); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,.3); }
    .btn-ghost { background: var(--white); color: var(--ink-1); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-purple:hover { background: #5b21b6; transform: translateY(-2px); }
    .access-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 22px 24px; text-align: left; box-shadow: var(--sh-sm); }
    .access-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-5); margin-bottom: 14px; }
    .plan-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: var(--r-md); margin-bottom: 8px; }
    .plan-row:last-child { margin-bottom: 0; }
    .plan-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
    .plan-name { font-size: 0.84rem; font-weight: 600; color: var(--ink-0); flex: 1; }
    .plan-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); }
    .b-curr { background: var(--purple-soft); color: var(--purple); }
    .b-need { background: var(--amber-soft); color: var(--amber); }
  </style>
</head>
<body>
  <script>(function(){ try { var t=localStorage.getItem('lms-theme'); if(t) document.documentElement.setAttribute('data-theme',t); } catch(e){} })();</script>
  <a href="../index.html" class="nav-logo"><div class="logo-mark">AL</div><span class="logo-name">AzureLMS</span></a>
  <button class="theme-btn" onclick="toggleTheme()"><i class="bi bi-moon-stars" id="themeIcon"></i></button>

  <div class="error-wrap">
    <svg class="illustration" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
      <!-- Background glow -->
      <ellipse cx="130" cy="160" rx="80" ry="30" fill="var(--purple-soft)" opacity=".4"/>
      <!-- Lock body -->
      <rect x="80" y="110" width="100" height="80" rx="12" fill="var(--white)" stroke="var(--border)" stroke-width="1.5"/>
      <!-- Lock shackle -->
      <path d="M100 110 L100 80 Q100 50 130 50 Q160 50 160 80 L160 110" fill="none" stroke="var(--purple)" stroke-width="8" stroke-linecap="round"/>
      <!-- Keyhole -->
      <circle cx="130" cy="148" r="12" fill="var(--purple)" opacity=".15"/>
      <circle cx="130" cy="145" r="7" fill="var(--purple)"/>
      <rect x="126" y="150" width="8" height="18" rx="2" fill="var(--purple)"/>
      <!-- Warning stars -->
      <circle cx="60" cy="80" r="4" fill="var(--amber)" opacity=".5"/>
      <circle cx="200" cy="90" r="3" fill="var(--purple)" opacity=".4"/>
      <circle cx="55" cy="140" r="3" fill="var(--purple)" opacity=".3"/>
      <circle cx="210" cy="150" r="4" fill="var(--amber)" opacity=".35"/>
    </svg>

    <div class="error-code">403</div>
    <div class="error-title">Ruxsat yo'q</div>
    <div class="error-desc">Bu sahifaga kirish uchun sizda yetarli huquq yo'q. Bu Premium kontent bo'lishi mumkin yoki siz tizimga kirmagansiz.</div>

    <div class="btn-row">
      <a href="../auth/auth-login.html" class="btn btn-primary"><i class="bi bi-person-fill"></i> Kirish</a>
      <a href="../public/pricing.html" class="btn btn-purple"><i class="bi bi-stars"></i> Premium olish</a>
      <button class="btn btn-ghost" onclick="history.back()"><i class="bi bi-arrow-left"></i> Orqaga</button>
    </div>

    <div class="access-box">
      <div class="access-title">Tarif rejangiz</div>
      <div class="plan-row">
        <div class="plan-icon" style="background:var(--purple-soft);color:var(--purple)"><i class="bi bi-person"></i></div>
        <span class="plan-name">Sizning rejaniz: Bepul</span>
        <span class="plan-badge b-curr">Joriy</span>
      </div>
      <div class="plan-row">
        <div class="plan-icon" style="background:var(--amber-soft);color:var(--amber)"><i class="bi bi-star-fill"></i></div>
        <span class="plan-name">Premium — barcha imkoniyatlar</span>
        <span class="plan-badge b-need">Kerak</span>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').className = isDark ? 'bi bi-moon-stars' : 'bi bi-sun';
      try { localStorage.setItem('lms-theme', isDark ? 'light' : 'dark'); } catch(e){}
    }
    (function(){ try { if(localStorage.getItem('lms-theme')==='dark') document.getElementById('themeIcon').className='bi bi-sun'; } catch(e){} })();
  </script>
</body>
</html>
