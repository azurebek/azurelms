{% load static %}
<!doctype html>
<html lang="uz" data-theme="light" class="{% block document_class %}{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ frontend_v1_title }} · {{ site_settings.brand_name|default:"AzureLMS" }}</title>
  {% include "components/brand_favicon.html" %}
  <script src="{% static 'frontend_v1/js/theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'frontend_v1/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'frontend_v1/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'frontend_v1/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'frontend_v1/css/shell.css' %}">
  <link rel="stylesheet" href="{% static 'frontend_v1/css/auth.css' %}">
  <link rel="stylesheet" href="{% static 'frontend_v1/css/learning.css' %}">
  <script defer src="{% static 'frontend_v1/js/shell.js' %}"></script>
  {% block extra_head %}{% endblock %}
</head>
<body data-frontend="v1" data-screen="{{ request.resolver_match.url_name }}" class="{% block body_class %}{% endblock %}">
  <a class="s-skip" href="#main">Asosiy mazmunga o‘tish</a>
  {% block body %}{% endblock %}
</body>
</html>
