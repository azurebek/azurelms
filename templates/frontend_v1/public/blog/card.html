<article class="c-card p-public-info-card">{% if item.cover_image %}<img class="p-public-image" src="{{ item.cover_image.url }}" alt="{{ item.cover_alt_text }}" loading="lazy">{% endif %}<p class="c-caption">{{ item.published_at|date:"d.m.Y" }} · {{ item.reading_time_minutes }} daqiqa</p><h2>{{ item.title }}</h2><p class="c-muted">{{ item.excerpt }}</p><a class="c-text-link" href="{{ item.get_absolute_url }}?return_to={{ request.get_full_path|urlencode }}">Maqolani o‘qish {% include "frontend_v1/icon.html" with name="arrow" %}</a></article>
