<article class="c-card p-public-info-card">{% if item.cover_image %}<img class="p-public-image" src="{{ item.cover_image.url }}" alt="{{ item.cover_alt_text }}" loading="lazy">{% endif %}<p class="c-caption"><time datetime="{{ item.published_at|date:'c' }}">{{ item.published_at|date:"d.m.Y" }}</time> · {{ item.reading_time_minutes }} daqiqa</p><h3>{{ item.title }}</h3><p class="c-muted">{{ item.excerpt }}</p><a class="c-text-link" aria-label="{{ item.title }} — maqolani o‘qish" href="{{ item.get_absolute_url }}{% if blog_return_to %}?return_to={{ blog_return_to|urlencode }}{% endif %}">Maqolani o‘qish {% include "frontend_v1/icon.html" with name="arrow" %}</a></article>
