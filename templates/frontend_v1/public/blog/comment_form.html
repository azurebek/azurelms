<form method="post" action="{% url 'blog:comment_create' post.slug %}" class="p-public-stack" data-public-comment>{% csrf_token %}{% if comment %}<input type="hidden" name="parent_id" value="{{ comment.pk }}">{% endif %}<label class="c-field__label" for="comment-text-{{ comment.pk|default:'new' }}">{% if comment %}{{ comment.user.get_full_name|default:comment.user.username }}ga javob{% else %}Izohingiz{% endif %}</label><textarea class="c-field" id="comment-text-{{ comment.pk|default:'new' }}" name="content" maxlength="2000" rows="3" required></textarea><button class="c-button c-button--primary" type="submit">Yuborish</button></form>
