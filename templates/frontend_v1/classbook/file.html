{% if widget.is_initial %}<p class="c-caption">Media fayl biriktirilgan. Yangi fayl tanlanmasa, mavjud fayl saqlanadi.</p>{% if not widget.required %}<label class="c-choice"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}><span>Mavjud media biriktirmasini olib tashlash</span></label>{% endif %}{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% for name, value in widget.attrs.items %}{% if value is not False %} {{ name }}{% if value is not True %}="{{ value }}"{% endif %}{% endif %}{% endfor %}>
