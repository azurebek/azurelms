<article class="p-public-story"><div class="p-public-media{% if not item.cover_image %} p-public-media--atmos{% if atmos_class %} {{ atmos_class }}{% endif %}{% endif %} p-public-story__media">{% if item.cover_image %}<img class="p-public-media__image" src="{{ item.cover_image.url }}" alt="{{ item.cover_alt_text }}" loading="lazy" decoding="async">{% endif %}</div>{% with tag=item.tags.all.0 %}{% if tag %}<span class="c-badge c-badge--soft">{{ tag.name }}</span>{% endif %}{% endwith %}<h3><a aria-label="{{ item.title }} — maqolani o‘qish" href="{{ item.get_absolute_url }}{% if blog_return_to %}?return_to={{ blog_return_to|urlencode }}{% endif %}">{{ item.title }}</a></h3>{% if item.excerpt %}<p class="c-muted">{{ item.excerpt }}</p>{% endif %}<p class="c-caption"><time datetime="{{ item.published_at|date:'c' }}">{{ item.published_at|date:"d.m.Y" }}</time> · {{ item.reading_time_minutes }} daqiqa</p></article>
