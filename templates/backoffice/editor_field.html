{% if field.is_hidden %}{{ field }}{% else %}
<div class="bo-editor-field">
  {% if field.field.widget.input_type == 'checkbox' %}
  <label class="bo-editor-check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
  <label class="bo-lbl" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="bo-help" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
