<style>body{overflow-wrap:anywhere}.sample-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:var(--az-surface);border-bottom:1px solid var(--az-border)}.sample-head strong{color:var(--az-action)}.sample-main{padding:var(--dc-density,24px);display:grid;gap:var(--dc-density,24px);min-width:0}.sample-card{padding:var(--dc-card-pad,var(--dc-density,24px));display:grid;gap:16px}.sample-art{padding:36px 24px;background:var(--az-hero);color:var(--az-action);border-bottom:1px solid var(--az-border);font-size:var(--az-text-2xl);font-weight:var(--az-weight-bold);letter-spacing:var(--az-tracking)}.sample-line{display:flex;justify-content:space-between;align-items:center;gap:16px}.sample-label{font-size:var(--az-text-xs);color:var(--az-muted)}.sample-main .c-actions{margin-top:0}.sample-main h1{font-size:var(--az-text-title)}.sample-main .s-mw-message{max-width:90%}.sample-lesson{max-width:var(--dc-reading-width,var(--az-reading))}.sample-chat{display:grid;gap:var(--az-space-5);padding:0;list-style:none}.sample-main .s-mw-composer{padding:var(--az-space-4);border:1px solid var(--az-border);border-radius:var(--dc-composer-radius,var(--az-radius-sm))}.sample-main .ws-page-head{margin-bottom:0}.sample-main .ws-card{padding:var(--dc-card-pad,var(--dc-density,24px))}.sample-main .ws-field{margin:18px 0}.sample-main .ws-button{pointer-events:none}.sample-nav{display:flex;gap:var(--az-space-2);padding:var(--az-space-3);background:var(--az-side);border-bottom:1px solid var(--az-border);flex-wrap:wrap}.sample-nav .c-nav-item{flex:1;justify-content:center}.sample-main button{cursor:default}.sample-word{color:var(--az-action);font-size:var(--az-text-2xl)}@media(max-width:450px){.sample-head{padding:16px}.sample-main{padding:var(--dc-density,16px)}.sample-line{align-items:flex-start;flex-wrap:wrap}.sample-main .c-actions{flex-direction:column;align-items:stretch}.sample-main h1{font-size:var(--az-text-2xl)}}</style>

<template id="design-sample-course"><header class="sample-head"><strong>{{ site_settings.brand_name|default:"AzureLMS" }}</strong><span class="sample-label">Kurs namunasi</span></header><nav class="sample-nav" aria-label="Namuna bo‘limlari"><span class="c-nav-item is-active">Kurslarim</span><span class="c-nav-item">Xabarlar</span><span class="c-nav-item">Hisob</span></nav><main class="sample-main"><div><p class="c-eyebrow">TURK TILI · BOSHLANG‘ICH</p><h1>Yangi tilga ilk qadam.</h1></div><section class="c-card"><div class="sample-art">Merhaba, dünya!</div><div class="sample-card"><div class="sample-line"><h2>Kundalik turk tili</h2><span class="c-badge">A1 daraja</span></div><p>Salomlashishdan ilk suhbatgacha — sodda izohlar va hayotiy misollar bilan.</p><p class="c-muted">O‘zingizga qulay vaqtda, bir darsdan boshlang.</p><div class="c-actions"><button type="button" class="c-button c-button--primary">Darsni boshlash</button><button type="button" class="c-button c-button--secondary">Kurs haqida</button></div></div></section><section class="c-card sample-card"><p class="c-eyebrow">BIRINCHI MAVZU</p><h2>Tanishuv va salomlashish</h2><p>İstanbul, Iğdır, Şanlıurfa. O‘zbekcha izohlar, turkcha misollar va sizning ilk suhbatingiz.</p></section></main></template>
<template id="design-sample-lesson"><header class="sample-head"><strong>{{ site_settings.brand_name|default:"AzureLMS" }}</strong><span class="sample-label">Dars namunasi</span></header><main class="sample-main"><p class="c-eyebrow">KUNDALIK TURK TILI / TANISHUV</p><h1>Merhaba! Keling, tanishamiz.</h1><article class="c-card f-lesson-text sample-lesson"><h2>Birinchi suhbat</h2><p>Yangi tanishingizga «Merhaba» deb salom bering. Ismingizni aytish uchun «Benim adım…» jumlasidan foydalaning.</p><p class="sample-word">Benim adım Malika.</p><p>Bu «Mening ismim Malika» degani. Endi o‘z ismingiz bilan aytib ko‘ring.</p><h3>Yodda tuting</h3><p class="c-muted">Turk tilidagi ğ, ş, ı, İ, ç, ö, ü harflariga e’tibor bering. O‘qish uchun matn aniq va yetarlicha katta bo‘lishi kerak.</p></article><section class="c-card sample-card"><label class="c-field__label" for="sample-answer">O‘zingizni tanishtiring</label><input class="c-field" id="sample-answer" value="Benim adım…" readonly><div class="c-actions"><button type="button" class="c-button c-button--primary">Davom etish</button><button type="button" class="c-button c-button--secondary">Oldingi dars</button><button type="button" class="c-button" disabled>Hali ochilmagan</button></div></section></main></template>
<template id="design-sample-chat"><header class="sample-head"><strong>{{ site_settings.brand_name|default:"AzureLMS" }}</strong><span class="sample-label">Suhbat namunasi</span></header><main class="sample-main"><div class="sample-line"><div><p class="c-eyebrow">XABARLAR</p><h1>Ustoz bilan suhbat</h1></div><span class="c-avatar" aria-hidden="true">U</span></div><ul class="sample-chat"><li class="s-mw-message"><div class="s-mw-bubble"><strong class="s-mw-author">Ustoz</strong><p>Merhaba! Bugun o‘zingizni turk tilida tanishtirib ko‘ramiz.</p></div></li><li class="s-mw-message" data-own><div class="s-mw-bubble"><p>Benim adım Malika. «Tanishganimdan xursandman» qanday aytiladi?</p></div></li><li class="s-mw-message"><div class="s-mw-bubble"><strong class="s-mw-author">Ustoz</strong><p>«Memnun oldum.» Juda yaxshi boshladingiz!</p></div></li></ul><div class="s-mw-composer"><label for="sample-message">Xabar</label><div class="s-mw-composer-row"><textarea id="sample-message" readonly placeholder="Xabar yozing…"></textarea><button type="button" class="c-icon-button s-mw-send" aria-label="Yuborish namunasi">↑</button></div></div><p class="c-caption">Namuna — bu xabarlar yuborilmaydi.</p></main></template>
<template id="design-sample-workspace"><div class="workspace-body"><header class="sample-head"><strong>{{ site_settings.brand_name|default:"AzureLMS" }}</strong><span class="sample-label">Boshqaruv namunasi</span></header><main class="sample-main"><div class="ws-page-head"><div><p class="ws-eyebrow">KURSLAR</p><h1>Yangi dars tayyorlash</h1><p class="ws-lead">Bir mavzu, aniq izoh va amaliy mashq.</p></div></div><section class="ws-card"><h2>Dars haqida</h2><div class="ws-field"><label for="sample-lesson-title">Dars nomi</label><input id="sample-lesson-title" value="Birinchi suhbat" readonly></div><div class="ws-field"><label for="sample-module">Bo‘lim</label><select id="sample-module"><option>Tanishuv va salomlashish</option></select></div><div class="dw-actions"><button type="button" class="ws-button ws-button-primary">Darsni saqlash</button><button type="button" class="ws-button">Ko‘rib chiqish</button></div></section><p class="ws-muted">Bu namuna. Haqiqiy kursga o‘zgartirish kiritilmaydi.</p></main></div></template>
