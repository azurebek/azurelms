{% comment %}Dars muharriridagi «Materiallar» bo'limining uslublari.{% endcomment %}
<style>
  .lesson-editor-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.25rem;align-items:start}
  .lesson-editor-layout>*{min-width:0}
  .lm-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);max-width:1080px;margin-top:22px;min-width:0;overflow-wrap:anywhere}
  .lm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
  .lm-head-title{font-family:inherit;font-size:1.125rem;line-height:1.5;font-weight:600;color:var(--ink);margin:0}
  .lm-row{padding:13px 18px}
  .lm-row+.lm-row{border-top:1px solid var(--line-2)}
  .lm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .lm-top>*{min-width:0;max-width:100%}
  .lm-order{width:4.5em;max-width:100%;min-height:2.75rem;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-size:1rem;text-align:center}
  .lm-name{font-size:1rem;line-height:1.5;font-weight:600;color:var(--ink);min-width:0;flex:1 1 220px}
  .lm-sub{font-family:inherit;font-size:.9375rem;line-height:1.6;color:var(--ink-3);margin:.375rem 0 0}
  .lm-flag{font-size:.9375rem;line-height:1.5;font-weight:600;border-radius:999px;padding:.25rem .625rem;background:var(--paper-2);color:var(--ink-3)}
  .lm-flag.is-green{background:var(--green-soft);color:var(--green)}
  .lm-flag.is-amber{background:var(--amber-soft);color:var(--amber)}
  .lm-btn{height:auto;min-height:2.75rem;max-width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.375rem;padding:.625rem .75rem;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink-2);font-size:1rem;line-height:1.5;font-weight:600;cursor:pointer;text-decoration:none;white-space:normal;text-align:center}
  .lm-btn.is-primary{background:var(--azure);color:var(--on-azure);border-color:var(--azure)}
  .lm-details{margin-top:10px}
  .lm-details summary{cursor:pointer;min-height:2.75rem;padding-block:.625rem;font-size:1rem;line-height:1.5;color:var(--ink)}
  .lm-settings{margin-top:.75rem;padding:.75rem;border:1px dashed var(--line);border-radius:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:1rem;align-items:start}
  .lm-setting{min-width:0}
  .lm-settings .bo-lbl{display:block;font-size:1rem;line-height:1.5;color:var(--ink);margin-bottom:.5rem}
  .lm-settings .field-input{width:100%;box-sizing:border-box;min-width:0;max-width:100%}
  .lm-check{display:flex;align-items:flex-start;gap:.5rem;font-size:1rem;line-height:1.5;color:var(--ink)}
  .lm-check input{flex:none;margin-top:.25em}
  .lm-empty{padding:1rem;font-size:1rem;line-height:1.5;color:var(--ink-3)}
  @media(max-width:60rem){.lesson-editor-layout{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:40rem){.lm-name{flex:1 1 100%}.lm-settings{grid-template-columns:minmax(0,1fr)}}
</style>
