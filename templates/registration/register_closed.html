{% extends "base_public.html" %}

{% block title %}Ro'yxatdan o'tish yopiq — AzureLMS{% endblock %}

{% block content %}
<div style="max-width:560px;margin:0 auto;padding:clamp(48px,8vw,96px) clamp(18px,4vw,32px);text-align:center;">
  <span style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--amber-soft);color:var(--amber);font-size:24px;margin-bottom:20px;"><i class="bi bi-hourglass-split" aria-hidden="true"></i></span>
  <h1 style="font-size:clamp(22px,2.6vw,28px);font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:0 0 12px;">Ro'yxatdan o'tish vaqtincha yopiq</h1>
  <p style="font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 26px;">Hozircha yangi hisob ochilmayapti. Hisobingiz bo'lsa, odatdagidek kirishingiz mumkin.</p>
  <a href="{% url 'login' %}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:11px;background:var(--azure);color:var(--on-azure);font-size:14.5px;font-weight:600;">Kirish <i class="bi bi-arrow-right" style="font-size:12px;" aria-hidden="true"></i></a>
</div>
{% endblock %}
