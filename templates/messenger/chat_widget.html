{% load static %}

<!-- FAB Bubble -->
<button class="messenger-fab" id="messenger-fab" onclick="toggleMessenger()">
    <i class="bi bi-chat-dots-fill"></i>
</button>

<!-- Main Widget -->
<div id="azure-messenger-widget" hidden>
    <!-- Resize Handles -->
    <div class="resize-handle resize-n"></div>
    <div class="resize-handle resize-s"></div>
    <div class="resize-handle resize-e"></div>
    <div class="resize-handle resize-w"></div>
    <div class="resize-handle resize-ne"></div>
    <div class="resize-handle resize-nw"></div>
    <div class="resize-handle resize-se"></div>
    <div class="resize-handle resize-sw"></div>

    <!-- Header -->
    <div class="messenger-header" id="messenger-header">
        <div class="messenger-header-info">
            <div class="messenger-header-icon">
                <i class="bi bi-chat-quote text-white"></i>
            </div>
            <div class="messenger-header-copy">
                <p>AzureLMS Messenger</p>
                <small id="messenger-subtitle"><span class="online-dot"></span> Onlayn</small>
            </div>
        </div>
        <div class="messenger-controls">
            <button class="messenger-control-btn" onclick="toggleMessenger()" title="Kichraytirish">
                <i class="bi bi-dash-lg"></i>
            </button>
            <button class="messenger-control-btn" onclick="toggleMessenger()" title="Yopish">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="messenger-tabs" id="messenger-tabs">
        <button class="messenger-tab-btn active" data-tab="group" onclick="loadRoom('group')">
            <i class="bi bi-people"></i> Guruh
        </button>
        <button class="messenger-tab-btn" data-tab="private" onclick="loadRoom('private')">
            <i class="bi bi-person-check"></i> Tutor
        </button>
        <button class="messenger-tab-btn" data-tab="ai" onclick="loadRoom('ai')">
            <i class="bi bi-robot"></i> AzureAI
        </button>
    </nav>

    <!-- Chat Body -->
    <div class="messenger-body">
        <div class="messenger-chat-window" id="main-chat-window">
            <div class="text-center text-muted small mt-4" id="chat-loading">Xonalar yuklanmoqda...</div>
        </div>
        
        <!-- Input Area -->
        <div class="messenger-footer" id="chat-input-area">
            <div class="messenger-input-wrapper">
                <input type="text" id="chat-input-field" placeholder="Xabar yozing..." autocomplete="off">
            </div>
            <button class="messenger-send-btn" id="chat-send-btn" onclick="sendMessage()">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

    <!-- Footer Resize Hint -->
    <div class="resize-hint">Chekkalardan tortib o'lchamini o'zgartiring</div>
</div>

<script>
    // Constants & Global Logic state
    const userId = "{{ request.user.id }}";
    const userName = "{{ request.user.first_name|default:request.user.username }}";
    const currentLessonIdRaw = "{{ lesson.id|default_if_none:'' }}";
    const currentLessonId = /^\d+$/.test(currentLessonIdRaw) ? Number(currentLessonIdRaw) : null;
    const STORAGE_KEY = `azure_messenger_state_${userId}`;

    // Core functional state
    let chatSocket = null;
    let currentRoomId = null;
    let availableRooms = [];
    const pendingMessages = new Map();

    // UI & Window state
    let messengerState = {
        isOpen: false,
        activeTab: 'group',
        width: 360,
        height: 520,
        x: window.innerWidth - 380,
        y: window.innerHeight - 540
    };

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messengerState));
    }

    function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                messengerState = { ...messengerState, ...parsed };
                // Clamp coordinates to screen
                messengerState.x = Math.max(10, Math.min(window.innerWidth - messengerState.width - 10, messengerState.x));
                messengerState.y = Math.max(10, Math.min(window.innerHeight - messengerState.height - 10, messengerState.y));
            } catch(e) {}
        }
    }

    function applyState() {
        const widget = document.getElementById('azure-messenger-widget');
        const fab = document.getElementById('messenger-fab');

        widget.hidden = !messengerState.isOpen;
        fab.style.display = messengerState.isOpen ? 'none' : 'flex';

        if (messengerState.isOpen) {
            widget.style.width = messengerState.width + 'px';
            widget.style.height = messengerState.height + 'px';
            widget.style.left = messengerState.x + 'px';
            widget.style.top = messengerState.y + 'px';

            if (availableRooms.length === 0) fetchRooms();
            else updateTabUI(messengerState.activeTab);
        }
    }

    function toggleMessenger() {
        messengerState.isOpen = !messengerState.isOpen;
        saveState();
        applyState();
    }

    // --- Drag & Resize Logic ---
    const widget = document.getElementById('azure-messenger-widget');
    const header = document.getElementById('messenger-header');

    // Dragging
    header.addEventListener('mousedown', (e) => {
        if (window.innerWidth <= 640) return;
        e.preventDefault();
        let startX = e.clientX;
        let startY = e.clientY;
        let origX = messengerState.x;
        let origY = messengerState.y;

        function onMouseMove(e) {
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            messengerState.x = origX + dx;
            messengerState.y = origY + dy;
            widget.style.left = messengerState.x + 'px';
            widget.style.top = messengerState.y + 'px';
        }

        function onMouseUp() {
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            saveState();
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
    });

    // Resizing
    document.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const dir = handle.classList[1].split('-')[1]; // e.g., 'se'
            let startX = e.clientX;
            let startY = e.clientY;
            let startW = messengerState.width;
            let startH = messengerState.height;
            let startXPos = messengerState.x;
            let startYPos = messengerState.y;

            function onMouseMove(e) {
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;

                if (dir.includes('e')) messengerState.width = Math.max(300, startW + dx);
                if (dir.includes('s')) messengerState.height = Math.max(380, startH + dy);
                if (dir.includes('w')) {
                    let newW = Math.max(300, startW - dx);
                    if (newW !== 300) {
                        messengerState.x = startXPos + dx;
                        messengerState.width = newW;
                    }
                }
                if (dir.includes('n')) {
                    let newH = Math.max(380, startH - dy);
                    if (newH !== 380) {
                        messengerState.y = startYPos + dy;
                        messengerState.height = newH;
                    }
                }

                widget.style.width = messengerState.width + 'px';
                widget.style.height = messengerState.height + 'px';
                widget.style.left = messengerState.x + 'px';
                widget.style.top = messengerState.y + 'px';
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                saveState();
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        });
    });

    // --- Chat Logic ---

    function updateTabUI(roomType) {
        document.querySelectorAll('.messenger-tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === roomType);
        });

        const subtitle = document.getElementById('messenger-subtitle');
        if (roomType === 'ai') {
            subtitle.innerHTML = '<i class="bi bi-stars"></i> AzureAI Assistant';
        } else if (roomType === 'private') {
            subtitle.innerHTML = '<span class="online-dot"></span> Tutor (Ustoz)';
        } else {
            subtitle.innerHTML = '<span class="online-dot"></span> Guruh Muloqoti';
        }
    }

    async function fetchRooms() {
        try {
            const res = await fetch("{% url 'messenger:get_user_rooms' %}", {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            });
            const data = await res.json();
            if (data.status === 'success') {
                availableRooms = data.rooms;
                loadRoom(messengerState.activeTab);
            }
        } catch (e) {
            console.error("Xonalarni olishda xatolik", e);
            document.getElementById('chat-loading').innerText = "Ulanishda xatolik yuz berdi.";
        }
    }

    async function loadRoom(roomType) {
        messengerState.activeTab = roomType;
        saveState();
        updateTabUI(roomType);

        const mainWin = document.getElementById('main-chat-window');
        mainWin.classList.toggle('messenger-chat-window--ai', roomType === 'ai');
        mainWin.innerHTML = '<div class="text-center text-muted small mt-4">Xabarlar yuklanmoqda...</div>';

        const room = availableRooms.find(r => r.type === roomType);
        if (!room) {
            if (roomType !== 'group') return loadRoom('group');
            mainWin.innerHTML = '<div class="text-center text-muted small mt-4">Xona topilmadi.</div>';
            return;
        }

        currentRoomId = room.id;
        
        try {
            const res = await fetch(`/messenger/api/messages/${currentRoomId}/?_=${Date.now()}`, {
                cache: 'no-store'
            });
            const data = await res.json();
            if (data.status === 'success') {
                renderMessages(data.messages);
                connectWebSocket(currentRoomId);
            }
        } catch(e) {
            mainWin.innerHTML = '<div class="text-center text-danger small mt-4">Xatolik yuz berdi.</div>';
        }
    }

    function renderMessages(messages) {
        const win = document.getElementById('main-chat-window');
        win.innerHTML = '';
        if (messages.length === 0) {
            win.innerHTML = '<div class="text-center text-muted small mt-4">Suhbatni boshlang!</div>';
            return;
        }
        messages.forEach(msg => appendMessage(msg));
        scrollToBottom();
    }

    function appendMessage(msg, opts = {}) {
        const win = document.getElementById('main-chat-window');
        const isMe = msg.sender_id == userId;

        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'is-me' : ''}`;
        if (msg.client_message_id) wrapper.dataset.clientMessageId = msg.client_message_id;

        let nameHtml = (!isMe && messengerState.activeTab === 'group') ? `<span class="msg-sender-name">${msg.sender_name}</span>` : '';

        wrapper.innerHTML = `
            ${nameHtml}
            <div class="msg-bubble ${isMe ? 'msg-sent' : 'msg-rcvd'}">
                ${formatText(msg.text)}
            </div>
            <span class="msg-meta">${msg.created_at || 'Hozir'}</span>
        `;

        if (opts.replaceNode) opts.replaceNode.replaceWith(wrapper);
        else win.appendChild(wrapper);

        scrollToBottom();
        return wrapper;
    }

    function formatText(text) {
        return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    function scrollToBottom() {
        const win = document.getElementById('main-chat-window');
        win.scrollTop = win.scrollHeight;
    }

    function connectWebSocket(roomId) {
        if (chatSocket) chatSocket.close();
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        chatSocket = new WebSocket(`${protocol}//${window.location.host}/ws/chat/${roomId}/`);

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.client_message_id && pendingMessages.has(data.client_message_id)) {
                const node = pendingMessages.get(data.client_message_id);
                appendMessage({
                    text: data.message,
                    sender_id: data.sender_id,
                    sender_name: data.sender_name,
                    created_at: data.created_at
                }, { replaceNode: node });
                pendingMessages.delete(data.client_message_id);
            } else {
                appendMessage({
                    text: data.message,
                    sender_id: data.sender_id,
                    sender_name: data.sender_name,
                    created_at: data.created_at
                });
            }
        };
    }

    function sendMessage() {
        const input = document.getElementById('chat-input-field');
        const message = input.value.trim();
        if (message && chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            const clientId = `c_${Date.now()}`;
            const node = appendMessage({
                text: message,
                sender_id: userId,
                sender_name: userName,
                created_at: 'Yuborilmoqda...'
            });
            pendingMessages.set(clientId, node);

            chatSocket.send(JSON.stringify({
                'message': message,
                'context_lesson_id': currentLessonId,
                'client_message_id': clientId
            }));
            input.value = '';
        }
    }

    document.getElementById('chat-input-field').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });

    // Initialize
    window.addEventListener('load', () => {
        loadState();
        applyState();
    });

    // Handle window resize to keep messenger in view
    window.addEventListener('resize', () => {
        if (messengerState.isOpen && window.innerWidth > 640) {
            messengerState.x = Math.max(10, Math.min(window.innerWidth - messengerState.width - 10, messengerState.x));
            messengerState.y = Math.max(10, Math.min(window.innerHeight - messengerState.height - 10, messengerState.y));
            widget.style.left = messengerState.x + 'px';
            widget.style.top = messengerState.y + 'px';
        }
    });

</script>
